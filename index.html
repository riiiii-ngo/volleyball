<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1330">
<title>バレーボール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/court.css">
<link rel="stylesheet" href="css/roster.css">
<link rel="stylesheet" href="css/training.css">
<link rel="stylesheet" href="css/gacha.css">
<link rel="stylesheet" href="css/shop.css">
<link rel="stylesheet" href="css/lineup.css">
<link rel="stylesheet" href="css/header.css">
</head>
<body>
<!--
  ゲーム全体の唯一のページ。中身は VolleyballApp が URL ハッシュ(#/title, #/menu/team, #/practice …)
  に応じて js/screens/*.js の画面を #screenRoot に1つだけ生成する。
  新しい画面は js/screens/ にファイルを作って VolleyballApp.register() し、下で読み込むだけ。
-->
<header id="appHeader"></header>
<div id="screenRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="errorBanner" class="error-banner"></div>

<script>
  // デバッグ用: JSエラーが起きたら画面上に赤帯で表示する(スマホでDevToolsが開けなくても確認できるように)。
  (function () {
    const banner = document.getElementById('errorBanner');
    let lastMsg = null;
    let count = 0;
    function show(msg) {
      if (msg === lastMsg) return; // 毎フレーム同じエラーが出続けて埋まるのを防ぐ
      lastMsg = msg;
      count++;
      if (count > 20) return;
      banner.style.display = 'block';
      banner.textContent += msg + '\n\n';
    }
    window.addEventListener('error', function (e) {
      show('[error] ' + e.message + ' (' + e.filename + ':' + e.lineno + ':' + e.colno + ')');
    });
    window.addEventListener('unhandledrejection', function (e) {
      show('[unhandledrejection] ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
    });
  })();
</script>

<script src="js/no-zoom.js"></script>
<script src="js/data/progression.js"></script>
<script src="js/data/repository.js"></script>
<script src="js/data/json-source.js"></script>
<script>
  // キャラクター/チームデータの保存先。DB(サーバーAPI)に移す時はここのソースを差し替える。
  VolleyballData.configure({ source: 'json', baseUrl: 'data/' });
</script>
<script src="js/app.js"></script>
<script src="js/screens/ui.js"></script>
<script src="js/screens/header.js"></script>
<script src="js/screens/title.js"></script>
<script src="js/screens/menu.js"></script>
<script src="js/screens/practice.js"></script>
<script src="js/screens/roster.js"></script>
<script src="js/screens/training.js"></script>
<script src="js/screens/gacha.js"></script>
<script src="js/screens/shop.js"></script>
<script src="js/screens/lineup.js"></script>
<script>
  VolleyballApp.start({
    root: document.getElementById('screenRoot'),
    toast: document.getElementById('toast'),
    header: VolleyballHeader.create(document.getElementById('appHeader'))
  });
</script>
</body>
</html>
